name: roommate
description: RoomMate - share expenses, stay united, make it easy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  image_picker: any
  url_launcher: any
  shared_preferences: any
  pdf: any
  excel: any
  path_provider: any
  share_plus: ^10.1.4
  local_auth: any
  google_mlkit_text_recognition: any
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: any
flutter:
  uses-material-design: true
